<div class="d-flex flex-column vh-100 bg-light text-dark">

  <!-- Header Superior -->
  <header class="app-header d-flex align-items-center justify-content-between px-3 py-2 bg-white border-bottom shadow-sm">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-outline-secondary d-md-none p-1" (click)="toggleSidebar()">
        ☰
      </button>
      <img src="assets/Logo.png" alt="PD Logo" height="40" class="logo-img" />
      <h2 class="m-0 fs-4 fw-bold text-dark">PD Engineering Tools</h2>
    </div>
  </header>

  <div class="d-flex flex-grow-1 overflow-hidden">

    <!-- Menú Lateral / Sidebar -->
    <aside [class.d-none]="!isSidebarOpen" class="sidebar-menu bg-white border-end p-3 d-md-block" style="width: 260px;">
      <ul class="nav flex-column gap-2">

        <!-- 1. PROCESSES -->
        <li class="nav-item">
          <button class="btn btn-aqua-header w-100 text-start fw-bold d-flex justify-content-between align-items-center" (click)="toggleProcesses()">
            <span>PROCESSES</span>
            <small>{{ openProcesses ? '▲' : '▼' }}</small>
          </button>
          <ul *ngIf="openProcesses" class="nav flex-column ms-3 mt-1 gap-1">
            <li>
              <span class="nav-link small text-muted">No items available</span>
            </li>
          </ul>
        </li>

        <!-- 2. REPORTS -->
        <li class="nav-item">
          <button class="btn btn-aqua-header w-100 text-start fw-bold d-flex justify-content-between align-items-center" (click)="toggleReports()">
            <span>REPORTS</span>
            <small>{{ openReports ? '▲' : '▼' }}</small>
          </button>
          <ul *ngIf="openReports" class="nav flex-column ms-3 mt-1 gap-1">
            <li>
              <a 
                href="javascript:void(0)" 
                class="nav-link small text-primary fw-semibold sidebar-sublink" 
                [class.active-sublink]="currentView === 'operation-analysis'"
                (click)="selectView('operation-analysis')"
              >
                • Operation Analysis Report
              </a>
            </li>
          </ul>
        </li>

        <!-- 3. MASTER DATA -->
        <li class="nav-item">
          <button class="btn btn-aqua-header w-100 text-start fw-bold d-flex justify-content-between align-items-center" (click)="toggleMasterData()">
            <span>MASTER DATA</span>
            <small>{{ openMasterData ? '▲' : '▼' }}</small>
          </button>
          <ul *ngIf="openMasterData" class="nav flex-column ms-3 mt-1 gap-1">
            <li>
              <span class="nav-link small text-muted">No items available</span>
            </li>
          </ul>
        </li>

      </ul>
    </aside>

    <!-- Área de Contenido Principal -->
    <main class="main-content flex-grow-1 p-4 overflow-auto">

      <!-- Estado Inicial: Pantalla Vacía / Mensaje de Bienvenida -->
      <div *ngIf="!currentView" class="h-100 d-flex flex-column align-items-center justify-content-center text-muted">
        <div class="text-center">
          <i class="bi bi-layout-sidebar-inset fs-1 mb-2"></i>
          <h4 class="fw-normal text-secondary">Welcome to PD Engineering Tools</h4>
          <p class="small">Please select an option from the left menu to display its content.</p>
        </div>
      </div>

      <!-- Contenido: Operation Analysis Report -->
      <div *ngIf="currentView === 'operation-analysis'">
        
        <!-- Sub-encabezado -->
        <div class="sub-header pb-2 mb-3 border-bottom">
          <h5 class="m-0 text-dark fw-semibold">Operation Analysis Report</h5>
        </div>

        <!-- Cuadro de Controles (Dropdown + Botones Clear/Generate) -->
        <div class="card bg-white border mb-4 p-3 rounded-3 shadow-sm">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">

            <!-- Dropdown List con [ngValue] para preservar números -->
            <div class="flex-grow-1" style="max-width: 450px;">
              
              <select class="form-select bg-white text-dark border" [(ngModel)]="selectedOperationId" [disabled]="isLoadingOperations">
                <option [ngValue]="null" disabled selected>
                  {{ isLoadingOperations ? 'Loading operations...' : 'Operations' }}
                </option>
                <option *ngFor="let op of operationsList" [ngValue]="op['operationid'] ?? op.OperationId ?? op.id">
                  {{ op.Description || op.OperationName || op['description'] }}
                </option>
              </select>
                          
            </div>

            <!-- Grupo de Botones -->
            <div class="d-flex gap-2">
              <!-- Botón Clear -->
              <button 
                class="btn btn-outline-secondary px-3 fw-bold" 
                (click)="clearSelection()" 
                [disabled]="!selectedOperationId && !showReport">
                Clear
              </button>

              <!-- Botón Generate -->
              <button 
                class="btn btn-aqua-primary text-white px-4 fw-bold" 
                (click)="generateReport()" 
                [disabled]="!selectedOperationId">
                Generate
              </button>
            </div>

          </div>
        </div>

        <!-- Vista previa del Reporte -->
        <div *ngIf="showReport" class="report-preview-container">
          <app-reports [operationId]="operationIdToPass ?? selectedOperationId"></app-reports>
        </div>

      </div>

    </main>
  </div>
</div>
